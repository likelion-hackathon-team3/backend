spring.application.name=backend

# 자동 테스트 전용 DB 설정 (실제 실행용 MySQL과 완전히 분리).
# main의 application.properties(MySQL)를 이 파일이 덮어써서,
# 테스트는 DB_USERNAME/DB_PASSWORD 환경변수나 로컬 MySQL에 의존하지 않는다.
#
# H2 인메모리 + MySQL 호환 모드(MODE=MySQL)로 방언 차이를 줄인다.
# DB_CLOSE_DELAY=-1 : 커넥션이 모두 닫혀도 JVM 종료 전까지 인메모리 DB를 유지한다.
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# 테스트마다 스키마를 새로 만들고 끝나면 지운다(테스트 간 격리).
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
