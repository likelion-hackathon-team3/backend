spring.application.name=backend

# .env 파일을 properties 형식으로 읽어 아래 ${DB_...} 값에 사용한다.
# optional: 파일이 없어도 실행 실패하지 않음 / 실행 작업 디렉터리(backendServer) 기준으로 .env를 찾는다.
spring.config.import=optional:file:.env[.properties]

# MySQL 데이터베이스 (실제 애플리케이션 실행용)
# 접속 계정/비밀번호는 Git에 넣지 않고 환경변수로 주입한다.
# DB_NAME 미지정 시 기본값 backend_db 사용.
spring.datasource.url=jdbc:mysql://localhost:3306/${DB_NAME:backend_db}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
# ddl-auto=update : Entity를 기준으로 테이블을 자동 생성/수정
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
