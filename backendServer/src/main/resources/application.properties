spring.application.name=backend
server.port=${PORT:8080}

# .env 파일을 properties 형식으로 읽어 아래 ${DB_...} 값에 사용한다.
# optional: 파일이 없어도 실행 실패하지 않음 / 실행 작업 디렉터리(backendServer) 기준으로 .env를 찾는다.
spring.config.import=optional:file:.env[.properties]

# MySQL 데이터베이스 (실제 애플리케이션 실행용)
# 접속 주소/계정/비밀번호는 Git에 넣지 않고 환경변수로 주입한다.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
# ddl-auto=update : Entity를 기준으로 테이블을 자동 생성/수정
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# AiServer Timeline 연동을 위한 Spring 클라이언트 설정
# base-url 미설정 시 AI 호출을 시도하지 않고 기존 fallback을 사용한다.
# 실제 URL/포트는 실행 환경에서 AISERVER_BASE_URL로 주입한다.
aiserver.base-url=${AISERVER_BASE_URL:}
aiserver.timeout-ms=${AISERVER_TIMEOUT_MS:120000}

# 프론트엔드 CORS 허용 Origin (쉼표로 여러 개 지정 가능)
# 실행 환경에서 CORS_ALLOWED_ORIGINS로 주입, 미설정 시 로컬 프론트 기본값 사용.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# 근무표 사진 업로드(POST /api/schedules/recognize)를 위한 multipart 크기 제한.
# 기본값(max-file-size=1MB)이 실제 스마트폰 사진보다 작아 10MB로 완화한다.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
